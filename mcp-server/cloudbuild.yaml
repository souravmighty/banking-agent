steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/transaction-mcp-server', '.']
  
  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/transaction-mcp-server']
  
  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_ACCOUNT=$$(grep -E '^DEPLOY_SERVICE_ACCOUNT=' .env 2>/dev/null | cut -d'=' -f2 | tr -d '\"'\' || true)
        if [ -z "$$SERVICE_ACCOUNT" ]; then
          SERVICE_ACCOUNT="mcp-server-sa@$PROJECT_ID.iam.gserviceaccount.com"
        fi
        echo "Deploying to Cloud Run with Service Account: $$SERVICE_ACCOUNT"

        ENV_FLAGS=""
        if [ -f .env ]; then
          python3 -c "
        with open('.env') as f, open('.env.yaml', 'w') as out:
            for line in f:
                line = line.strip()
                if line and not line.startswith('#') and '=' in line:
                    k, v = line.split('=', 1)
                    k, v = k.strip(), v.strip().strip('\"\'')
                    if k != 'DEPLOY_SERVICE_ACCOUNT':
                        escaped_v = v.replace('\\\\', '\\\\\\\\').replace('\"', '\\\"')
                        out.write(f'{k}: \"{escaped_v}\"\n')
        "
          ENV_FLAGS="--env-vars-file=.env.yaml"
        fi

        gcloud run deploy transaction-mcp-server \
          --image gcr.io/$PROJECT_ID/transaction-mcp-server \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --service-account "$$SERVICE_ACCOUNT" \
          $$ENV_FLAGS

images:
  - 'gcr.io/$PROJECT_ID/transaction-mcp-server'
