rules:
  - id: QG001
    title: "Preferred Analytics Source for Customer 360"
    target_tables:
      - customers
      - analytics_customer_360
    target_metrics:
      - total_customer_balance
      - product_penetration
    rule_type: PREFERRED_SOURCE
    rule_text: "Prefer `analytics_customer_360` instead of raw `customers` for customer-level aggregated metrics and demographic segment breakdowns."
    sql_snippet: "FROM `{dataset}.analytics_customer_360`"

  - id: QG002
    title: "SCD Type 2 Current Version Filter"
    target_tables:
      - customers
      - accounts
      - credit_cards
    target_metrics: []
    rule_type: SCD2_FILTER
    rule_text: "For current customer, account, or card attributes from SCD Type 2 tables, always filter `is_current = TRUE` (or `eff_end_ts IS NULL`)."
    sql_snippet: "WHERE is_current = TRUE"

  - id: QG003
    title: "SCD Type 2 Point-in-Time Historical Query Filter"
    target_tables:
      - customers
      - accounts
      - credit_cards
    target_metrics: []
    rule_type: TEMPORAL_GUIDANCE
    rule_text: "For historical state as of date D on SCD Type 2 tables, filter `eff_start_ts <= TIMESTAMP(D)` AND `(eff_end_ts > TIMESTAMP(D) OR eff_end_ts IS NULL)`."
    sql_snippet: "WHERE eff_start_ts <= TIMESTAMP('{date}') AND (eff_end_ts > TIMESTAMP('{date}') OR eff_end_ts IS NULL)"

  - id: QG004
    title: "Transaction Spend Direction Filter"
    target_tables:
      - transactions
      - analytics_transactions
    target_metrics:
      - credit_card_spend
      - average_transaction_value
    rule_type: AGGREGATION_RULE
    rule_text: "Use `SUM(amount)` only for `direction = 'DEBIT'` transactions when calculating spend and outflow metrics."
    sql_snippet: "WHERE direction = 'DEBIT'"

  - id: QG005
    title: "Transaction Fan-Out Join Warning"
    target_tables:
      - customers
      - accounts
      - transactions
    target_metrics: []
    rule_type: GRAIN_WARNING
    rule_text: "Joining customer-level or account-level data directly to transaction-level data causes row duplication. Aggregate transactions to customer or account grain before joining."
    sql_snippet: "WITH agg_tx AS (SELECT account_number, SUM(amount) AS total_spend FROM `{dataset}.transactions` WHERE direction = 'DEBIT' GROUP BY account_number) SELECT a.*, tx.total_spend FROM `{dataset}.accounts` a LEFT JOIN agg_tx tx ON a.account_number = tx.account_number"

  - id: QG006
    title: "Transaction Partition Optimization"
    target_tables:
      - transactions
      - analytics_transactions
    target_metrics: []
    rule_type: TEMPORAL_GUIDANCE
    rule_text: "Filter on `transaction_timestamp` or `transaction_date` to leverage BigQuery table partitioning and reduce scanned bytes."
    sql_snippet: "WHERE transaction_timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)"

  - id: QG007
    title: "PII Exclusion in Analytical Reporting"
    target_tables:
      - customers
      - beneficiaries
      - customer_identity_mapping
    target_metrics: []
    rule_type: GENERAL
    rule_text: "Never select or project raw PII columns (email, phone, address, card_number, firebase_uid) in analytical SQL queries. Use customer_id or aggregated dimensions."
    sql_snippet: "-- Avoid SELECT name, email, phone"
