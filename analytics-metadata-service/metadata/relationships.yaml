relationships:
  - left_table: customers
    left_column: customer_id
    right_table: accounts
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "One customer can hold multiple deposit accounts (Savings, Current, Salary)."
    allowed_for_analytics: true
    join_warning: "Joining customer master with accounts will replicate customer attributes across multiple accounts. Aggregate accounts before joining if analyzing customer grain."
    join_sql_template: "LEFT JOIN `{dataset}.accounts` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id AND `{right_alias}`.is_current = TRUE"

  - left_table: accounts
    left_column: account_number
    right_table: transactions
    right_column: account_number
    relationship_type: ONE_TO_MANY
    business_description: "One bank account has many transaction ledger records."
    allowed_for_analytics: true
    join_warning: "Joining account balances directly with transaction records creates high fan-out and leads to double-counting account balances. Aggregate transactions by account_number before joining."
    join_sql_template: "LEFT JOIN `{dataset}.transactions` ON `{left_alias}`.account_number = `{right_alias}`.account_number"

  - left_table: customers
    left_column: customer_id
    right_table: credit_cards
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "One customer can hold multiple credit cards."
    allowed_for_analytics: true
    join_warning: "Ensure `{right_alias}`.is_current = TRUE is applied when joining with credit_cards to avoid historical version duplication."
    join_sql_template: "LEFT JOIN `{dataset}.credit_cards` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id AND `{right_alias}`.is_current = TRUE"

  - left_table: customers
    left_column: customer_id
    right_table: loans
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "One customer can have multiple active or closed loans."
    allowed_for_analytics: true
    join_warning: "One customer may have multiple loan contracts. Aggregate loan balances to avoid row duplication."
    join_sql_template: "LEFT JOIN `{dataset}.loans` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: customers
    left_column: customer_id
    right_table: fixed_deposits
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "One customer can have multiple fixed deposit investments."
    allowed_for_analytics: true
    join_warning: "Aggregate fixed deposits before joining with customer demographics if calculating customer totals."
    join_sql_template: "LEFT JOIN `{dataset}.fixed_deposits` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: customers
    left_column: customer_id
    right_table: credit_scores
    right_column: customer_id
    relationship_type: ONE_TO_ONE
    business_description: "Each customer has a single latest credit score snapshot."
    allowed_for_analytics: true
    join_warning: null
    join_sql_template: "LEFT JOIN `{dataset}.credit_scores` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: customers
    left_column: customer_id
    right_table: beneficiaries
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "One customer can save multiple transfer beneficiaries."
    allowed_for_analytics: true
    join_warning: "Operational table; rarely needed in analytical aggregation queries."
    join_sql_template: "LEFT JOIN `{dataset}.beneficiaries` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: analytics_customer_acquisition
    left_column: customer_id
    right_table: analytics_customer_360
    right_column: customer_id
    relationship_type: ONE_TO_ONE
    business_description: "Links acquisition event records to the curated 360 customer profile."
    allowed_for_analytics: true
    join_warning: null
    join_sql_template: "LEFT JOIN `{dataset}.analytics_customer_360` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: analytics_customer_360
    left_column: customer_id
    right_table: analytics_transactions
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "Links customer 360 profile to enriched transactions."
    allowed_for_analytics: true
    join_warning: "Transaction level fan-out. Aggregate transactions before joining with customer_360 for customer-level metrics."
    join_sql_template: "LEFT JOIN `{dataset}.analytics_transactions` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: analytics_customer_360
    left_column: customer_id
    right_table: analytics_products
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "Links customer profile to individual product holdings."
    allowed_for_analytics: true
    join_warning: "Product holdings represent multiple rows per customer. Group by customer_id or filter product_type."
    join_sql_template: "LEFT JOIN `{dataset}.analytics_products` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"

  - left_table: analytics_customer_360
    left_column: customer_id
    right_table: analytics_balances
    right_column: customer_id
    relationship_type: ONE_TO_MANY
    business_description: "Links customer profile to daily balance snapshots."
    allowed_for_analytics: true
    join_warning: "Always filter by snapshot_date when querying analytics_balances to avoid aggregating over historical calendar days."
    join_sql_template: "LEFT JOIN `{dataset}.analytics_balances` ON `{left_alias}`.customer_id = `{right_alias}`.customer_id"
