metrics:
  - metric_name: new_customer_count
    display_name: "New Customer Count"
    description: "Total distinct count of newly acquired customers within the reporting window."
    business_definition: "Distinct count of customer IDs whose acquisition date or account creation date falls within the selected period."
    sql_expression: "COUNT(DISTINCT customer_id)"
    default_aggregation: COUNT
    data_type: INTEGER
    unit: "customers"
    source_tables:
      - analytics_customer_acquisition
      - analytics_customer_360
      - customers
    allowed_dimensions:
      - acquisition_channel
      - customer_segment
      - region
      - city
      - acquisition_date
      - month
      - quarter
      - year
    allowed_filters:
      - application_status
      - customer_segment
      - region
    is_ratio: false
    calculation_notes: "When querying analytics_customer_acquisition, filter by application_status = 'APPROVED' unless measuring top-of-funnel."
    tags:
      - acquisition
      - growth
      - core_kpi

  - metric_name: total_customer_balance
    display_name: "Total Customer Balance"
    description: "Sum of deposit ledger balances across all active customer deposit accounts."
    business_definition: "Aggregated sum of closing balances in active savings, current, and salary accounts."
    sql_expression: "SUM(balance)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - accounts
      - analytics_balances
      - analytics_customer_360
    allowed_dimensions:
      - account_type
      - customer_segment
      - region
      - branch_name
      - month
      - quarter
      - year
    allowed_filters:
      - account_status
      - account_type
      - customer_segment
    is_ratio: false
    calculation_notes: "When querying the raw accounts table, always ensure is_current = TRUE and account_status = 'ACTIVE'."
    tags:
      - deposits
      - financial
      - balance
      - core_kpi

  - metric_name: average_customer_balance
    display_name: "Average Customer Balance"
    description: "Average balance held per customer or account."
    business_definition: "Total deposit balance divided by distinct count of customers or accounts."
    sql_expression: "AVG(balance)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - accounts
      - analytics_balances
      - analytics_customer_360
    allowed_dimensions:
      - account_type
      - customer_segment
      - region
      - branch_name
      - month
      - year
    allowed_filters:
      - account_status
      - customer_segment
    is_ratio: true
    numerator_metric: total_customer_balance
    denominator_metric: active_customer_count
    calculation_notes: "For customer-level averages, prefer analytics_customer_360.total_deposit_balance to avoid account-level skew."
    tags:
      - deposits
      - average
      - financial

  - metric_name: credit_card_spend
    display_name: "Credit Card Spend"
    description: "Total debit card spend amount during the selected reporting period."
    business_definition: "Total debit transaction amount associated with credit-card transactions or card products during the reporting window."
    sql_expression: "SUM(amount)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - analytics_transactions
      - transactions
    allowed_dimensions:
      - customer_segment
      - merchant_category
      - region
      - transaction_type
      - month
      - quarter
      - year
    allowed_filters:
      - direction
      - transaction_type
      - category
    is_ratio: false
    calculation_notes: "Must filter by direction = 'DEBIT' and transaction_type = 'CARD_PAYMENT' (or merchant_category IS NOT NULL)."
    tags:
      - cards
      - spend
      - volume
      - payments

  - metric_name: customer_acquisition_rate
    display_name: "Customer Acquisition Rate"
    description: "Ratio of newly acquired customers to total customer base or total applications."
    business_definition: "Approved customer acquisitions divided by total submitted onboarding applications within the same period."
    sql_expression: "COUNTIF(application_status = 'APPROVED') / COUNT(*)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "percentage"
    source_tables:
      - analytics_customer_acquisition
    allowed_dimensions:
      - acquisition_channel
      - customer_segment
      - region
      - month
      - quarter
      - year
    allowed_filters:
      - acquisition_channel
      - customer_segment
    is_ratio: true
    calculation_notes: "Measures application conversion efficiency across channels."
    tags:
      - acquisition
      - conversion
      - ratio

  - metric_name: average_transaction_value
    display_name: "Average Transaction Value"
    description: "Average financial ticket size per transaction."
    business_definition: "Total transaction debit volume divided by total count of debit transactions."
    sql_expression: "AVG(amount)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - analytics_transactions
      - transactions
    allowed_dimensions:
      - transaction_type
      - merchant_category
      - customer_segment
      - region
      - month
    allowed_filters:
      - direction
      - transaction_type
    is_ratio: false
    calculation_notes: "Always filter for direction = 'DEBIT' to isolate retail and payment spend."
    tags:
      - transactions
      - ticket_size

  - metric_name: loan_outstanding_balance
    display_name: "Total Loan Outstanding Balance"
    description: "Total outstanding loan principal and interest across all active borrowing accounts."
    business_definition: "Sum of outstanding_amount for all active credit and loan contracts."
    sql_expression: "SUM(outstanding_amount)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - loans
      - analytics_customer_360
    allowed_dimensions:
      - loan_type
      - customer_segment
      - region
      - month
      - year
    allowed_filters:
      - status
      - loan_type
    is_ratio: false
    calculation_notes: "Filter status = 'ACTIVE' when querying loans table."
    tags:
      - lending
      - credit
      - risk

  - metric_name: product_penetration
    display_name: "Product Penetration"
    description: "Average number of active banking products held per customer."
    business_definition: "Total active product contracts divided by the total number of distinct active customers."
    sql_expression: "AVG(active_product_count)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "products/customer"
    source_tables:
      - analytics_customer_360
      - analytics_products
    allowed_dimensions:
      - customer_segment
      - region
      - month
      - year
    allowed_filters:
      - customer_segment
      - region
    is_ratio: true
    calculation_notes: "Higher penetration indicates successful cross-selling and lower customer churn risk."
    tags:
      - products
      - cross_sell
      - engagement

  - metric_name: customer_retention_rate
    display_name: "Customer Retention Rate"
    description: "Proportion of active customers who remain active over a given reporting duration."
    business_definition: "Count of customers active at period end divided by active customers at period start."
    sql_expression: "COUNTIF(customer_status = 'ACTIVE') / COUNT(*)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "percentage"
    source_tables:
      - customers
      - analytics_customer_360
    allowed_dimensions:
      - customer_segment
      - region
      - month
      - year
    allowed_filters:
      - customer_segment
      - risk_profile
    is_ratio: true
    calculation_notes: "When using raw customers table, filter is_current = TRUE."
    tags:
      - retention
      - customer_health

  - metric_name: customer_attrition_rate
    display_name: "Customer Churn / Attrition Rate"
    description: "Percentage of customers who closed or inactivated their accounts during the timeframe."
    business_definition: "Count of closed/dormant customers divided by total customer base."
    sql_expression: "COUNTIF(customer_status IN ('CLOSED', 'DORMANT')) / COUNT(*)"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "percentage"
    source_tables:
      - customers
      - analytics_customer_360
    allowed_dimensions:
      - customer_segment
      - region
      - month
      - year
    allowed_filters:
      - customer_segment
      - risk_profile
    is_ratio: true
    calculation_notes: "Complement of customer retention rate."
    tags:
      - churn
      - attrition
      - risk

  - metric_name: credit_utilization_rate
    display_name: "Credit Card Utilization Rate"
    description: "Percentage of total approved credit limit currently utilized by cardholders."
    business_definition: "Total outstanding credit card balance divided by total approved credit limit."
    sql_expression: "SUM(outstanding_balance) / NULLIF(SUM(credit_limit), 0) * 100"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "percentage"
    source_tables:
      - credit_cards
      - analytics_customer_360
    allowed_dimensions:
      - card_type
      - customer_segment
      - region
      - month
    allowed_filters:
      - status
      - card_type
    is_ratio: true
    calculation_notes: "Ensure is_current = TRUE and status = 'ACTIVE' when querying credit_cards."
    tags:
      - cards
      - risk
      - utilization

  - metric_name: total_loan_disbursed
    display_name: "Total Loan Disbursed Volume"
    description: "Sum of sanctioned and disbursed loan principal amounts."
    business_definition: "Sum of loan_amount for all loan originations."
    sql_expression: "SUM(loan_amount)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - loans
    allowed_dimensions:
      - loan_type
      - customer_segment
      - start_date
      - month
      - year
    allowed_filters:
      - loan_type
      - status
    is_ratio: false
    calculation_notes: "Measures gross lending origination velocity."
    tags:
      - lending
      - origination

  - metric_name: fd_total_investment
    display_name: "Fixed Deposit Total Holdings"
    description: "Total invested capital held in term deposits."
    business_definition: "Sum of current_value across active fixed deposits."
    sql_expression: "SUM(current_value)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - fixed_deposits
      - analytics_customer_360
    allowed_dimensions:
      - tenure_months
      - customer_segment
      - month
      - year
    allowed_filters:
      - status
    is_ratio: false
    calculation_notes: "Filter status = 'ACTIVE' for ongoing investments."
    tags:
      - investments
      - term_deposits

  - metric_name: credit_card_payoff_rate
    display_name: "Credit Card Payoff Rate"
    description: "Monthly percentage of credit card statement balances paid off by cardholders."
    business_definition: "Total payments made divided by previous month statement balance."
    sql_expression: "SUM(total_payments) / NULLIF(SUM(previous_statement_balance), 0) * 100"
    default_aggregation: AVG
    data_type: FLOAT
    unit: "percentage"
    source_tables:
      - credit_cards
      - analytics_balances
      - analytics_transactions
    allowed_dimensions:
      - card_type
      - customer_segment
      - month
      - year
    allowed_filters:
      - card_type
      - customer_segment
    is_ratio: true
    calculation_notes: "A spike in payoff rate indicates accelerated debt reduction or tax refund paydowns."
    tags:
      - cards
      - balance
      - payoff
      - root_cause

  - metric_name: credit_card_total_balance
    display_name: "Total Credit Card Outstanding Balance"
    description: "Sum of outstanding balances across all active credit cards."
    business_definition: "Aggregated sum of outstanding unpaid balances across credit cards."
    sql_expression: "SUM(outstanding_balance)"
    default_aggregation: SUM
    data_type: FLOAT
    unit: "INR"
    source_tables:
      - credit_cards
      - analytics_balances
      - analytics_customer_360
    allowed_dimensions:
      - card_type
      - customer_segment
      - region
      - month
      - year
    allowed_filters:
      - card_type
      - customer_segment
      - status
    is_ratio: false
    calculation_notes: "Always filter is_current = TRUE when querying credit_cards directly."
    tags:
      - cards
      - balance
      - liabilities

