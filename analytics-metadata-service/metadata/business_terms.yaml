business_terms:
  - term: "customer acquisition"
    mapped_metric: new_customer_count
    mapped_dimension: acquisition_channel
    mapped_table: analytics_customer_acquisition
    definition: "Process and metrics around onboarding new retail or corporate customers."
    synonyms:
      - "new customers"
      - "customer signups"
      - "onboarding"
      - "new accounts"
      - "new users"

  - term: "customer balance"
    mapped_metric: total_customer_balance
    mapped_dimension: account_type
    mapped_table: accounts
    definition: "Funds and liquid capital held in bank deposit accounts."
    synonyms:
      - "account balance"
      - "total deposits"
      - "deposits"
      - "bank balance"
      - "liquidity"

  - term: "credit card spend"
    mapped_metric: credit_card_spend
    mapped_dimension: merchant_category
    mapped_table: analytics_transactions
    definition: "Outflow payments and merchant transactions settled on credit cards."
    synonyms:
      - "card spend"
      - "card expenditure"
      - "card volume"
      - "card purchases"

  - term: "churn"
    mapped_metric: customer_attrition_rate
    mapped_dimension: customer_segment
    mapped_table: customers
    definition: "Rate at which customers inactivate or close their accounts."
    synonyms:
      - "attrition"
      - "customer attrition"
      - "account closures"
      - "drop-off"

  - term: "loan balance"
    mapped_metric: loan_outstanding_balance
    mapped_dimension: loan_type
    mapped_table: loans
    definition: "Unpaid principal balance remaining across active loan products."
    synonyms:
      - "loan outstanding"
      - "debt"
      - "borrowings"
      - "credit outstanding"

  - term: "product penetration"
    mapped_metric: product_penetration
    mapped_dimension: product_type
    mapped_table: analytics_products
    definition: "Measure of cross-sell depth across customer base."
    synonyms:
      - "cross-sell"
      - "products per customer"
      - "holdings depth"

  - term: "credit utilization"
    mapped_metric: credit_utilization_rate
    mapped_dimension: customer_segment
    mapped_table: credit_cards
    definition: "Ratio of utilized revolving credit to total credit limit."
    synonyms:
      - "card utilization"
      - "credit line usage"
      - "utilization ratio"
