dimensions:
  - dimension_name: customer_segment
    display_name: "Customer Segment"
    description: "Customer relationship and wealth tier."
    source_table: customers
    source_column: customer_segment
    data_type: STRING
    allowed_filters:
      - RETAIL
      - PREMIUM
      - WEALTH
      - STUDENT
      - SENIOR_CITIZEN
    allowed_grouping: true
    hierarchy: null
    tags:
      - customer
      - segmentation
      - marketing

  - dimension_name: region
    display_name: "Geographic Region"
    description: "Macro geographic zone covering customer branch and residency."
    source_table: analytics_customer_360
    source_column: region
    data_type: STRING
    allowed_filters:
      - North
      - South
      - East
      - West
      - Central
    allowed_grouping: true
    hierarchy:
      level: 1
      parent: null
      children:
        - state
        - city
      levels:
        - Region
        - State
        - City
    tags:
      - geography
      - hierarchy

  - dimension_name: city
    display_name: "City"
    description: "City of customer or branch location."
    source_table: analytics_customer_360
    source_column: city
    data_type: STRING
    allowed_filters: []
    allowed_grouping: true
    hierarchy:
      level: 3
      parent: state
      children: []
      levels:
        - Region
        - State
        - City
    tags:
      - geography

  - dimension_name: acquisition_channel
    display_name: "Acquisition Channel"
    description: "Marketing or onboarding route used by customer."
    source_table: analytics_customer_acquisition
    source_column: acquisition_channel
    data_type: STRING
    allowed_filters:
      - ORGANIC_DIGITAL
      - BRANCH
      - REFERRAL
      - PARTNER
      - PAID_CAMPAIGN
    allowed_grouping: true
    hierarchy: null
    tags:
      - acquisition
      - marketing

  - dimension_name: merchant_category
    display_name: "Merchant Spending Category"
    description: "High-level classification of merchant or transaction expense type."
    source_table: transactions
    source_column: category
    data_type: STRING
    allowed_filters:
      - GROCERY
      - FOOD
      - TRAVEL
      - SHOPPING
      - ENTERTAINMENT
      - UTILITIES
      - HEALTHCARE
      - EDUCATION
      - BANKING
      - OTHER
    allowed_grouping: true
    hierarchy: null
    tags:
      - transactions
      - merchant
      - spend

  - dimension_name: product_type
    display_name: "Product Type"
    description: "Category of banking product or account contract."
    source_table: analytics_products
    source_column: product_type
    data_type: STRING
    allowed_filters:
      - SAVINGS
      - CURRENT
      - CREDIT_CARD
      - LOAN
      - FIXED_DEPOSIT
    allowed_grouping: true
    hierarchy: null
    tags:
      - product

  - dimension_name: transaction_type
    display_name: "Transaction Payment Rail"
    description: "Rail or channel used for fund movement."
    source_table: transactions
    source_column: transaction_type
    data_type: STRING
    allowed_filters:
      - TRANSFER
      - UPI
      - CARD_PAYMENT
      - ATM_WITHDRAWAL
      - ATM_DEPOSIT
      - SALARY_CREDIT
      - INTEREST_CREDIT
      - LOAN_EMI
      - FD_DEPOSIT
      - BILL_PAYMENT
    allowed_grouping: true
    hierarchy: null
    tags:
      - payments
      - rails

  - dimension_name: risk_profile
    display_name: "Risk Profile"
    description: "Customer credit and compliance risk tier."
    source_table: customers
    source_column: risk_profile
    data_type: STRING
    allowed_filters:
      - LOW
      - MEDIUM
      - HIGH
    allowed_grouping: true
    hierarchy: null
    tags:
      - risk

  - dimension_name: month
    display_name: "Reporting Month"
    description: "Calendar month in YYYY-MM format."
    source_table: analytics_transactions
    source_column: month
    data_type: STRING
    allowed_filters: []
    allowed_grouping: true
    hierarchy:
      level: 3
      parent: quarter
      children: []
      levels:
        - Year
        - Quarter
        - Month
    tags:
      - temporal
      - hierarchy

  - dimension_name: quarter
    display_name: "Reporting Quarter"
    description: "Calendar quarter (e.g. Q1, Q2, Q3, Q4)."
    source_table: analytics_transactions
    source_column: quarter
    data_type: STRING
    allowed_filters:
      - Q1
      - Q2
      - Q3
      - Q4
    allowed_grouping: true
    hierarchy:
      level: 2
      parent: year
      children:
        - month
      levels:
        - Year
        - Quarter
        - Month
    tags:
      - temporal
      - hierarchy

  - dimension_name: year
    display_name: "Reporting Year"
    description: "Calendar year (e.g. 2024, 2025, 2026)."
    source_table: analytics_transactions
    source_column: year
    data_type: INTEGER
    allowed_filters: []
    allowed_grouping: true
    hierarchy:
      level: 1
      parent: null
      children:
        - quarter
        - month
      levels:
        - Year
        - Quarter
        - Month
    tags:
      - temporal
      - hierarchy
