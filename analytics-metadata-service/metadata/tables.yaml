      - column_name: transaction_timestamp
        business_description: "Exact timestamp of the transaction. Partitioning key."
        semantic_type: TIMESTAMP
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: true
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [temporal, partition_key]

