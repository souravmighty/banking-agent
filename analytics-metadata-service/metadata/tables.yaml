tables:
  - table_name: customers
    dataset_name: banking_data
    project_id: banking-agent-rag-mcp
    object_type: TABLE
    description: "Master customer dimension table containing demographic, KYC, risk profile, and segment information."
    business_domain: CUSTOMER
    business_entity: Customer
    business_purpose: "Stores customer profile, tier, and status for banking relationship management."
    grain: "One row per customer version (SCD Type 2)."
    scd_type: SCD_TYPE_2
    natural_key:
      - customer_id
    primary_key:
      - customer_id
      - record_version
    preferred_analytics_source: false
    allowed_for_analytics: true
    allowed_for_nl2sql: true
    allowed_for_visualization: true
    sensitivity_level: CONFIDENTIAL
    data_owner: "Customer Data Governance Team"
    effective_from_column: eff_start_ts
    effective_to_column: eff_end_ts
    current_flag_column: is_current
    clustering_columns: []
    tags:
      - core
      - customer
      - master_data
      - scd2
    columns:
      - column_name: customer_id
        business_description: "Unique 16-digit customer identifier. Primary business key."
        semantic_type: CUSTOMER_ID
        is_primary_key: true
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [key, id]
      - column_name: name
        business_description: "Full legal name of the customer."
        semantic_type: NAME
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: PII
        tags: [pii, name]
      - column_name: email
        business_description: "Primary email address used for contact and identity matching."
        semantic_type: EMAIL
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: false
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: PII
        tags: [pii, contact]
      - column_name: phone
        business_description: "Mobile contact phone number."
        semantic_type: PHONE
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: false
        is_groupable: false
        is_sortable: false
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: PII
        tags: [pii, contact]
      - column_name: address
        business_description: "Current residential street and city address."
        semantic_type: ADDRESS
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: false
        is_groupable: false
        is_sortable: false
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: PII
        tags: [pii, location]
      - column_name: customer_status
        business_description: "Operational status of customer account (ACTIVE, DORMANT, BLOCKED, CLOSED)."
        semantic_type: STATUS
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [status, operational]
      - column_name: customer_segment
        business_description: "Customer value tier (RETAIL, PREMIUM, WEALTH, STUDENT, SENIOR_CITIZEN)."
        semantic_type: SEGMENT
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [segmentation, marketing]
      - column_name: risk_profile
        business_description: "Internal compliance and credit risk classification (LOW, MEDIUM, HIGH)."
        semantic_type: CATEGORY
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [risk, compliance]
      - column_name: kyc_status
        business_description: "Know Your Customer verification status (VERIFIED, PENDING, REJECTED)."
        semantic_type: STATUS
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [kyc, compliance]
      - column_name: created_at
        business_description: "Customer initial onboarding date."
        semantic_type: DATE
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: true
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [temporal, acquisition]
      - column_name: eff_start_ts
        business_description: "SCD Type 2 effective start timestamp for version validity."
        semantic_type: TIMESTAMP
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: true
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [scd2, temporal]
      - column_name: eff_end_ts
        business_description: "SCD Type 2 effective end timestamp. NULL represents active current version."
        semantic_type: TIMESTAMP
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: true
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [scd2, temporal]
      - column_name: is_current
        business_description: "SCD Type 2 current record indicator flag."
        semantic_type: BOOLEAN
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: false
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [scd2, flag]
      - column_name: record_version
        business_description: "Sequential version number of the customer profile record."
        semantic_type: COUNT
        is_primary_key: true
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [scd2, version]

  - table_name: accounts
    dataset_name: banking_data
    project_id: banking-agent-rag-mcp
    object_type: TABLE
    description: "Deposit accounts table tracking balances, account types, branches, and statuses."
    business_domain: ACCOUNTS
    business_entity: Account
    business_purpose: "Stores customer core banking deposit accounts (Savings, Current, Salary)."
    grain: "One row per account version (SCD Type 2)."
    scd_type: SCD_TYPE_2
    natural_key:
      - account_number
    primary_key:
      - account_number
      - record_version
    preferred_analytics_source: false
    allowed_for_analytics: true
    allowed_for_nl2sql: true
    allowed_for_visualization: true
    sensitivity_level: FINANCIAL
    data_owner: "Retail Banking Operations"
    effective_from_column: eff_start_ts
    effective_to_column: eff_end_ts
    current_flag_column: is_current
    clustering_columns: []
    tags:
      - core
      - deposits
      - balances
      - scd2
