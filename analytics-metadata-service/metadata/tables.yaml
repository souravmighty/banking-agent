  - table_name: transactions
    dataset_name: banking_data
    project_id: banking-agent-rag-mcp
    object_type: TABLE
    description: "Granular financial transaction ledger recording all inflows and outflows across accounts."
    business_domain: TRANSACTIONS
    business_entity: Transaction
    business_purpose: "Records debits, credits, transfers, UPI, ATM, and card payment ledger events."
    grain: "One row per transaction ledger entry."
    scd_type: NONE
    natural_key:
      - transaction_id
    primary_key:
      - transaction_id
    preferred_analytics_source: false
    allowed_for_analytics: true
    allowed_for_nl2sql: true
    allowed_for_visualization: true
    sensitivity_level: FINANCIAL
    data_owner: "Payment Services & Ledger Systems"
    partitioning:
      type: DAY
      field: transaction_timestamp
    clustering_columns:
      - transaction_type
      - direction
    tags:
      - ledger
      - transactions
      - payments
      - partitioned
    columns:
      - column_name: transaction_id
        business_description: "Unique transaction identifier."
        semantic_type: TRANSACTION_ID
        is_primary_key: true
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [key, id]
      - column_name: reference_id
        business_description: "Transfer pairing reference linking debit and credit legs."
        semantic_type: TRANSACTION_ID
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: false
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [reference, correlation]
      - column_name: account_number
        business_description: "Account on which the transaction occurred."
        semantic_type: ACCOUNT_ID
        is_primary_key: false
        is_foreign_key: true
        references_table: accounts
        references_column: account_number
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: FINANCIAL
        tags: [fk, account]
      - column_name: counterparty_account_number
        business_description: "Target/source account number for transfers."
        semantic_type: ACCOUNT_ID
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: false
        is_time_dimension: false
        is_sensitive: true
        sensitivity_level: FINANCIAL
        tags: [counterparty]
      - column_name: transaction_type
        business_description: "Payment rail/type (TRANSFER, UPI, CARD_PAYMENT, ATM_WITHDRAWAL, SALARY_CREDIT, etc.)."
        semantic_type: CATEGORY
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [channel, type]
      - column_name: currency
        business_description: "Transaction currency."
        semantic_type: ENUM
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: false
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [currency]
      - column_name: direction
        business_description: "Cash flow direction (DEBIT for spend/outflow, CREDIT for deposit/inflow)."
        semantic_type: ENUM
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: false
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [flow, direction]
      - column_name: amount
        business_description: "Absolute transaction amount."
        semantic_type: CURRENCY
        is_primary_key: false
        is_foreign_key: false
        is_metric: true
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: FINANCIAL
        allowed_aggregations: [SUM, AVG, MIN, MAX, COUNT]
        default_aggregation: SUM
        tags: [metric, amount, financial]
      - column_name: merchant_name
        business_description: "Name of the merchant or counterparty business."
        semantic_type: NAME
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [merchant]
      - column_name: category
        business_description: "Merchant spending category (GROCERY, FOOD, TRAVEL, SHOPPING, UTILITIES, etc.)."
        semantic_type: CATEGORY
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: true
        is_filterable: true
        is_groupable: true
        is_sortable: true
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
        tags: [spend_category, dimension]
      - column_name: description
        business_description: "Transaction narrative/narration text."
        semantic_type: FREE_TEXT
        is_primary_key: false
        is_foreign_key: false
        is_metric: false
        is_dimension: false
        is_filterable: true
        is_groupable: false
        is_sortable: false
        is_time_dimension: false
        is_sensitive: false
        sensitivity_level: INTERNAL
