[project]
name = "banking-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.4.0",
    "db-dtypes>=1.7.0",
    "email-validator>=2.2.0",
    "faker>=40.1.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.14.0",
    "firebase-admin>=6.5.0",
    "google-adk[gcp,otel-gcp]>=2.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-dataplex>=2.20.0",
    "google-cloud-storage>=3.0.0",
    "google-genai",
    "httpx>=0.27.0",
    "pandas>=2.3.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
    "pyyaml>=6.0.2",
    "resend>=2.4.0",
    "uvicorn[standard]>=0.30.0",
    "vertexai>=1.43.0",
]

[dependency-groups]
dev = [
    "codespell",
    "ipykernel>=7.1.0",
    "mock",
    "mypy",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff",
]

# Source - https://stackoverflow.com/a/79528002
# Posted by Gwang-Jin Kim, modified by community. See post 'Timeline' for change history
# Retrieved 2026-06-01, License - CC BY-SA 4.0

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["./"]
include = ["deployment", "app"]


[project.scripts]
bq-agent = "bq_agent:app"
deploy-local = "deployment.local:main"
deploy-remote = "deployment.remote:main"
cleanup = "deployment.cleanup:cleanup_deployment"
