# Evaluation configuration for Analytics Copilot using agents-cli / ADK Eval Framework
metrics_to_run:
  # Built-In Platform Metrics
  - final_response_quality
  - safety
  # Custom Evaluator Metrics
  - sql_safety_and_validity
  - vega_lite_spec_validity
  - scd2_filter_compliance
  - zero_pii_compliance
  - parallel_fan_out
  - custom_response_quality

custom_metrics:
  - name: sql_safety_and_validity
    custom_function: |
      from tests.eval.custom_evaluators import evaluate_sql_safety_and_validity
      def evaluate(instance):
          return evaluate_sql_safety_and_validity(instance)

  - name: vega_lite_spec_validity
